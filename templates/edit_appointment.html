<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Appointment - CarePoint</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #082f49, #0e7490);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .card {
            width: 650px;
            background: rgba(255,255,255,0.12);
            padding: 35px;
            border-radius: 25px;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        .icon {
            text-align: center;
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #dbeafe;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        select,
        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row .form-group {
            flex: 1;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #f59e0b;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #d97706;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #bae6fd;
            text-decoration: none;
        }

        .back:hover {
            color: white;
        }

        @media (max-width: 650px) {

            .card {
                width: 100%;
            }

            .row {
                display: block;
            }

        }

    </style>

</head>

<body>

<div class="card">

    <div class="icon">✏️</div>

    <h1>Edit Appointment</h1>

    <p class="subtitle">
        Update appointment information
    </p>


    <form method="POST">


        <div class="form-group">

            <label>Patient</label>

            <select name="patient_id" required>

                {% for patient in patients %}

                <option
                    value="{{ patient.patient_id }}"
                    {% if patient.patient_id == appointment.patient_id %}
                    selected
                    {% endif %}
                >
                    {{ patient.patient_name }}
                </option>

                {% endfor %}

            </select>

        </div>


        <div class="form-group">

            <label>Doctor</label>

            <select name="doctor_id" required>

                {% for doctor in doctors %}

                <option
                    value="{{ doctor.doctor_id }}"
                    {% if doctor.doctor_id == appointment.doctor_id %}
                    selected
                    {% endif %}
                >
                    {{ doctor.doctor_name }} - {{ doctor.specialization }}
                </option>

                {% endfor %}

            </select>

        </div>


        <div class="row">

            <div class="form-group">

                <label>Appointment Date</label>

                <input
                    type="date"
                    name="appointment_date"
                    value="{{ appointment.appointment_date }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>Appointment Time</label>

                <input
                    type="time"
                    name="appointment_time"
                    value="{{ appointment.appointment_time }}"
                    required
                >

            </div>

        </div>


        <div class="form-group">

            <label>Reason</label>

            <textarea
                name="reason"
                required
            >{{ appointment.reason }}</textarea>

        </div>


        <button type="submit">
            💾 Update Appointment
        </button>

    </form>


    <a href="/appointments" class="back">
        ← Back to Appointments
    </a>

</div>

</body>

</html>
