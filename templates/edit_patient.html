<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Patient - CarePoint</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #082f49, #0e7490);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .card {
            width: 600px;
            background: rgba(255,255,255,0.12);
            padding: 35px;
            border-radius: 25px;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        .icon {
            text-align: center;
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #dbeafe;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row .form-group {
            flex: 1;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #06b6d4;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #0891b2;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #bae6fd;
            text-decoration: none;
        }

        .back:hover {
            color: white;
        }

        @media (max-width: 650px) {

            .card {
                width: 100%;
            }

            .row {
                display: block;
            }

        }

    </style>

</head>

<body>

    <div class="card">

        <div class="icon">✏️</div>

        <h1>Edit Patient</h1>

        <p class="subtitle">
            Update patient information
        </p>

        <form method="POST">

            <div class="form-group">

                <label>Patient Name</label>

                <input
                    type="text"
                    name="patient_name"
                    value="{{ patient.patient_name }}"
                    required
                >

            </div>


            <div class="row">

                <div class="form-group">

                    <label>Age</label>

                    <input
                        type="number"
                        name="age"
                        value="{{ patient.age }}"
                        min="1"
                        max="120"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Gender</label>

                    <select name="gender" required>

                        <option value="Male"
                            {% if patient.gender == "Male" %}selected{% endif %}>
                            Male
                        </option>

                        <option value="Female"
                            {% if patient.gender == "Female" %}selected{% endif %}>
                            Female
                        </option>

                        <option value="Other"
                            {% if patient.gender == "Other" %}selected{% endif %}>
                            Other
                        </option>

                    </select>

                </div>

            </div>


            <div class="form-group">

                <label>Phone</label>

                <input
                    type="tel"
                    name="phone"
                    value="{{ patient.phone }}"
                    maxlength="15"
                    required
                >

            </div>


            <div class="form-group">

                <label>Disease</label>

                <input
                    type="text"
                    name="disease"
                    value="{{ patient.disease }}"
                    required
                >

            </div>


            <button type="submit">
                💾 Update Patient
            </button>

        </form>


        <a href="/patients" class="back">
            ← Back to Patients
        </a>

    </div>

</body>

</html>
